; Configuración PHP por directorio (PHP la lee en FastCGI/PHP-FPM, que es como
; corre este sistema en IIS).
;
; POR QUÉ EXISTE ESTE ARCHIVO
; TicketBacros y Comedor se sirven desde el MISMO host (desarollo-bacros:
; /TicketBacros/ y /Comedor/) y ambos usaban la cookie de sesión por defecto
; (PHPSESSID) con path '/'. Resultado: compartían cookie y entrar a una app
; pisaba la sesión de la otra. Detrás de Cloudflare (varias apps bajo un mismo
; dominio) el choque sería permanente.
;
; La solución es darle a cada app su propio NOMBRE de cookie, en vez de
; separarlas por 'path': el path '/' es necesario para que la sesión funcione
; igual en /TicketBacros/ (producción), en la raíz (stacks locales/test) y al
; llegar desde el Portal Bacrocorp (SSO).
;
; Ojo al desplegar: al cambiar el nombre de la cookie, las sesiones abiertas
; dejan de reconocerse y los usuarios inician sesión una vez más.
session.name = TICKETSESSID
